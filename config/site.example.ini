# Copy this file to site.ini. The local file is intentionally ignored by Git.

[station]
callsign=N0CALL
dmr_id=0

[radio]
# Channel 1 center frequencies. Other channels use +/-25, 50 and 75 kHz.
rx_base_hz=431500000
tx_base_hz=446500000

# The M17 Project HAT has a fixed 32 MHz reference; 250 kS/s is a native rate.
sample_rate=250000

# Conservative full-duplex alignment values measured on one prototype.
rx_gain_db=30
tx_gain_db=0
digital_gain=35
rssi_calibration=70
