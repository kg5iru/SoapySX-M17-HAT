# Copy this file to site.ini. The local file is intentionally ignored by Git.

[station]
callsign=N0CALL
dmr_id=0

[radio]
# Channel 1 center frequencies. Other channels use +/-25, 50 and 75 kHz.
rx_base_hz=431500000
tx_base_hz=446500000

# Use 250 kS/s with a 32 MHz reference, including the M17 Project HAT.
# Use 300 kS/s when the SXceiver profile detects a 38.4 MHz reference.
sample_rate=250000

# Conservative full-duplex alignment values measured on one prototype.
rx_gain_db=30
tx_gain_db=0
digital_gain=35
rssi_calibration=70
